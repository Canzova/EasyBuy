# Default values for the planner Helm chart.
# Values here are based directly on the supplied Kubernetes manifests.

planner:
  replicaCount: 1

  image:
    repository: canzova/planner
    tag: "1.2"
    pullPolicy: IfNotPresent

  container:
    name: planner-pod-container
    port: 8080

  service:
    name: planner-service
    type: ClusterIP
    port: 8082
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

mysql:
  replicaCount: 3

  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent

  container:
    name: mysql-pod-container
    port: 3306

  service:
    name: mysql-service
    port: 3306

  resources:
    requests:
      memory: "250Mi"
      cpu: "512m"
    limits:
      memory: "1Gi"
      cpu: "1"

  persistence:
    volumeClaimTemplates:
      enabled: true
      name: mysql-storage-volume
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""

    # This is the separate PVC from the supplied pvc.yaml.
    # It is not referenced by the StatefulSet's volumeMounts.
    staticPvc:
      enabled: true
      name: mysql-pvc
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      storageClassName: ""

    # This is the PersistentVolume from the supplied pv.yaml.
    pv:
      enabled: true
      name: mysql-pv
      capacity: 2Gi
      accessModes:
        - ReadWriteOnce
      reclaimPolicy: Retain
      hostPath: /data/mysql

config:
  mysqlRootPassword: "root"
  mysqlDatabase: "planner_db"
  mysqlUser: "username"
  dbHost: ""       # Empty means use the rendered mysql headless service name.
  dbPort: "3306"
  dbName: "planner_db"
  dbUsername: "username"

secret:
  # These are the original values from planner-Secret.yaml decoded from base64.
  # Helm will base64-encode them again when rendering the Kubernetes Secret.
  dbPassword: "pwd"
  mysqlPassword: "pwd"

hpa:
  enabled: true
  name: blogapp-hpa
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  name: blog-ingress
  className: nginx
  host: blog.local
  path: /
  pathType: Prefix
