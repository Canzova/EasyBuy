apiVersion: v1
kind: Secret
metadata:
  # Named 'planner-secrets' to match secretKeyRef in 06-mysql-statefulset.yaml and 07-planner-deployment.yaml
  name: planner-secrets
  namespace: planner-app
type: Opaque # Opaque = generic key-value secret (most common type)

# stringData allows plaintext strings; Kubernetes automatically encodes them in base64 on apply
stringData:
  MYSQL_DATABASE: "plannerdb"
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "plannerpassword"
  MYSQL_USER: "planneruser"

  # Spring Boot datasource keys (matches what HikariCP expects)
  DB_PASSWORD: "plannerpassword"
  DB_USERNAME: "planneruser"
