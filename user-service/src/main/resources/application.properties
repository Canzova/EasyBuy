spring.application.name=user-service
spring.config.import=configserver:http://localhost:8079

# ==========================================
# Email & Password Reset Configuration
# ==========================================
# Active mail provider: resend | aws-ses
mail.provider=${MAIL_PROVIDER:aws-ses}

# AWS SES Configuration
aws.ses.region=${AWS_SES_REGION:us-east-1}
aws.ses.access-key-id=${AWS_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY_ID}
aws.ses.secret-access-key=${AWS_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_ACCESS_KEY}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:support@easybuy.com}

# Resend API Configuration
resend.api-key={cipher}aa068e76ee05af58984645112b479afc8befee11e034594602d0b83f247fc754f4eeb6c001d9d8082e5eba29346f8ba3dc9f4c4d281a74c7c06e46ec34d296d0
resend.from-email=${RESEND_FROM_EMAIL:EasyBuy <onboarding@resend.dev>}
resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}

# OTP & Reset Token Lifespan
otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
otp.reset-token-expiration-minutes=${OTP_RESET_TOKEN_EXPIRATION_MINUTES:15}