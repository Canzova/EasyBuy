spring.application.name=payment-service
spring.profiles.active=dev
spring.config.import=optional:configserver:http://localhost:8079

server.port=8085

# ===================================================================
# Razorpay Payment Gateway Configuration (Mock / Placeholder Data)
# ===================================================================
# Replace these mock values with your actual Razorpay credentials from
# Razorpay Dashboard: https://dashboard.razorpay.com/#/access/api-keys
# Or provide them via environment variables:
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_CURRENCY, RAZORPAY_WEBHOOK_SECRET
# ===================================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_mockKeyId123456}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:mockSecretKeyRazorpay987654}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:mockWebhookSecret123456}
